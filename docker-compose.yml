version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  firestore-emulator:
    image: google/cloud-sdk:latest
    command: /bin/bash -c "apt-get update && apt-get install -y openjdk-21-jre && gcloud beta emulators firestore start --host-port=0.0.0.0:8080"
    environment:
      - FIRESTORE_EMULATOR_HOST=0.0.0.0:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  firebase-auth-emulator:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm install -g firebase-tools@latest && firebase emulators:start --only auth --project gen-fashion-local"
    ports:
      - "9099:9099"
    volumes:
      - ./firebase.json:/workspace/firebase.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(9099,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      # Browser CORS for Flutter Web direct PUT uploads (Phase 8, M2 frontend ExecPlan).
      # MinIO ignores S3 PutBucketCors; this env var is the only working knob locally.
      # Production R2 uses the §8.4 bucket CORS rule instead.
      - MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:8088
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi-service:
    build:
      context: ./fastapi-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-auth-emulator:9099
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-gen-fashion-local}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/vertex-ai-sa.json
      - MAX_CLOSET_IMAGES_PER_USER=20
      - GOOGLE_GENAI_USE_VERTEXAI=true
      - IMAGE_ANALYSIS_MODEL=gemini-2.5-flash
      - R2_ENDPOINT_URL=http://minio:9000
      - R2_PUBLIC_ENDPOINT_URL=http://localhost:9000
      - R2_ACCESS_KEY_ID=minioadmin
      - R2_SECRET_ACCESS_KEY=minioadmin
      - R2_BUCKET_NAME=gen-fashion-images
      - TASK_QUEUE_MODE=local
      - ADK_INTERNAL_BASE_URL=http://fastapi-service:8000
      - INTERNAL_TASK_SECRET=${INTERNAL_TASK_SECRET:-local-dev-internal-secret}
      - AGENT_MODEL=gemini-2.0-flash
    depends_on:
      elasticsearch:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
      firebase-auth-emulator:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./fastapi-service:/app
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:-./credentials/vertex-ai-sa.json}:/credentials/vertex-ai-sa.json:ro
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  adk-agent-service:
    build:
      context: ./adk-agent-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-gen-fashion-local}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/vertex-ai-sa.json
      - GOOGLE_GENAI_USE_VERTEXAI=true
      # M1-4: gemini-2.0-flash is unavailable on Vertex AI for this project.
      - AGENT_MODEL=${AGENT_MODEL:-gemini-2.5-flash}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - R2_ENDPOINT_URL=http://minio:9000
      - R2_PUBLIC_ENDPOINT_URL=http://localhost:9000
      - R2_ACCESS_KEY_ID=minioadmin
      - R2_SECRET_ACCESS_KEY=minioadmin
      - R2_BUCKET_NAME=gen-fashion-images
    depends_on:
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./adk-agent-service:/app
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:-./credentials/vertex-ai-sa.json}:/credentials/vertex-ai-sa.json:ro
    command: sh -c "adk api_server --host 0.0.0.0 --port 3000"

volumes: {}
