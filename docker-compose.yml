version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  firestore-emulator:
    image: google/cloud-sdk:latest
    command: /bin/bash -c "apt-get update && apt-get install -y openjdk-11-jre && gcloud beta emulators firestore start --host-port=0.0.0.0:8080"
    environment:
      - FIRESTORE_EMULATOR_HOST=0.0.0.0:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi-service:
    build:
      context: ./fastapi-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - ELASTICSEARCH_HOST=elasticsearch:9200
      - FIREBASE_PROJECT_ID=gen-fashion-local
      - MAX_CLOSET_IMAGES_PER_USER=50
      - AGENT_MODEL=gemini-2.0-flash
    depends_on:
      elasticsearch:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
    volumes:
      - ./fastapi-service:/app
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  adk-agent-service:
    build:
      context: ./adk-agent-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY:-dummy-key}
      - AGENT_MODEL=gemini-2.0-flash
      - FASTAPI_SERVICE_URL=http://fastapi-service:8000
    depends_on:
      - fastapi-service
    volumes:
      - ./adk-agent-service:/app

volumes: {}
