version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - gen-fashion_elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  firestore-emulator:
    image: google/cloud-sdk:latest
    command: >-
      /bin/bash -c '
        apt-get update && apt-get install -y openjdk-21-jre &&
        metadata=$$(find /firestore-data -name "*.overall_export_metadata" -type f | sort | tail -n 1) &&
        if [ -n "$$metadata" ]; then
          import_arg="--import-data=$$metadata";
          echo "Importing Firestore emulator data from $$metadata";
        else
          import_arg="";
          echo "Starting Firestore emulator with empty persistent storage";
        fi &&
        export_firestore() {
          export_dir="/firestore-data/snapshot-$$(date +%s)";
          mkdir -p "$$export_dir";
          curl -fsS -X POST \
            "http://localhost:8080/emulator/v1/projects/$${FIREBASE_PROJECT_ID:-gen-fashion-local}:export" \
            -H "Content-Type: application/json" \
            -d "{\"database\":\"projects/$${FIREBASE_PROJECT_ID:-gen-fashion-local}/databases/(default)\",\"export_directory\":\"$$export_dir\"}" \
            >/dev/null &&
          echo "Firestore emulator data exported to $$export_dir";
        };
        trap "export_firestore; kill $$pid; wait $$pid" TERM INT;
        gcloud beta emulators firestore start --host-port=0.0.0.0:8080 $$import_arg &
        pid=$$!;
        wait $$pid
      '
    environment:
      - FIRESTORE_EMULATOR_HOST=0.0.0.0:8080
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-gen-fashion-local}
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 30s
    volumes:
      - gen-fashion_firestore-data:/firestore-data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  firebase-auth-emulator:
    build:
      context: ./firebase
      dockerfile: Dockerfile
    working_dir: /workspace
    command: sh -c "firebase emulators:start --only auth --project gen-fashion-local"
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - ./firebase.json:/workspace/firebase.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(9099,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      # Browser CORS for Flutter Web direct PUT uploads (Phase 8, M2 frontend ExecPlan).
      # MinIO ignores S3 PutBucketCors; this env var is the only working knob locally.
      # Production R2 uses the §8.4 bucket CORS rule instead.
      - MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:8088
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - gen-fashion_minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi-service:
    build:
      context: ./fastapi-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-auth-emulator:9099
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-gen-fashion-local}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-gen-fashion-local}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/vertex-ai-sa.json
      - MAX_CLOSET_IMAGES_PER_USER=20
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY:-}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-false}
      - IMAGE_ANALYSIS_MODEL=gemini-2.5-flash
      - MAX_DAILY_GENERATIONS_PER_USER=${MAX_DAILY_GENERATIONS_PER_USER:-5}
      - R2_ENDPOINT_URL=http://minio:9000
      - R2_PUBLIC_ENDPOINT_URL=http://localhost:9000
      - R2_ACCESS_KEY_ID=minioadmin
      - R2_SECRET_ACCESS_KEY=minioadmin
      - R2_BUCKET_NAME=gen-fashion-images
      - TASK_QUEUE_MODE=local
      - ADK_INTERNAL_BASE_URL=http://adk-agent-service:3000
      # The /internal/tasks/process-upload worker route lives in fastapi-service
      # itself, so the local task queue must post back here (not to the ADK svc).
      - FASTAPI_INTERNAL_BASE_URL=http://fastapi-service:8000
      - INTERNAL_TASK_SECRET=${INTERNAL_TASK_SECRET:-local-dev-internal-secret}
      - AGENT_MODEL=gemini-2.0-flash
    depends_on:
      elasticsearch:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
      firebase-auth-emulator:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./fastapi-service:/app
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:-./credentials/vertex-ai-sa.json}:/credentials/vertex-ai-sa.json:ro
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  adk-agent-service:
    build:
      context: ./adk-agent-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-gen-fashion-local}
      # Firestore data uses the Firebase project (matches fastapi + frontend),
      # which differs from the Vertex AI project (GOOGLE_CLOUD_PROJECT) locally.
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-gen-fashion-local}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/vertex-ai-sa.json
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY:-}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-false}
      # M1-4: gemini-2.0-flash is unavailable on Vertex AI for this project.
      - AGENT_MODEL=${AGENT_MODEL:-gemini-2.5-flash}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - R2_ENDPOINT_URL=http://minio:9000
      - R2_PUBLIC_ENDPOINT_URL=http://localhost:9000
      - R2_ACCESS_KEY_ID=minioadmin
      - R2_SECRET_ACCESS_KEY=minioadmin
      - R2_BUCKET_NAME=gen-fashion-images
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - FIRESTORE_DATABASE_ID=(default)
      - INTERNAL_TASK_SECRET=${INTERNAL_TASK_SECRET:-local-dev-internal-secret}
      # Rakuten Ichiba Item Search (MK-3); leave empty to disable search_rakuten.
      - RAKUTEN_APPLICATION_ID=${RAKUTEN_APPLICATION_ID:-}
      - RAKUTEN_ACCESS_KEY=${RAKUTEN_ACCESS_KEY:-}
      - RAKUTEN_AFFILIATE_ID=${RAKUTEN_AFFILIATE_ID:-}
      - RAKUTEN_APPLICATION_URL=${RAKUTEN_APPLICATION_URL:-https://gen-fashion-app.web.app/}
    depends_on:
      elasticsearch:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./adk-agent-service:/app
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:-./credentials/vertex-ai-sa.json}:/credentials/vertex-ai-sa.json:ro
    command: ["python", "-m", "uvicorn", "styling_app.server:app", "--host", "0.0.0.0", "--port", "3000", "--reload"]

volumes:
  gen-fashion_firestore-data:
    name: gen-fashion_firestore-data
  gen-fashion_elasticsearch-data:
    name: gen-fashion_elasticsearch-data
  gen-fashion_minio-data:
    name: gen-fashion_minio-data
